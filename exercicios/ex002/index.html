<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever tudo de qualquer jeito. Basta colocar tudo no meio do par tags &lt;p&gt; e &lt;/p&gt;</p><!-- LESS THAN / GREATER THAN "MAIOR QUE/MENOR QUE"-->
    <p>Se precisar quebrar o texto em algum lugar específico <br>como esse, você pode usar a tag &lt;br&gt;</p>
    <P>Vamos adicionar alguns símbolos especiais:
        &reg;<!--MARCA REGISTRADA-->
        &copy;<!--COPYRIGHT-->
        &trade;<!--TRADEMARK-->
        &Delta;</P>
    <P>
        &#x1F596;
        &#X1F913;
    </P>
</body>
</html>
