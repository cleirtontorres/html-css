<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            background-color: antiquewhite;
            border: 2px solid black;
            margin-top: 10px;
        }

        div.itens{
            height:70px;
            background-color: aqua;
            margin: 10px;
            border: 2px solid black;
            text-align: center;
            border-radius: 10px;
        }

        .a{
            flex: 0 1 150px;
        }

        .b{
            flex: 2 0 150px;
        }

        .c{
            flex: 1 2 auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="itens a">A</div>
        <div class="itens b">B</div>
        <div class="itens c">C</div>
    </div>
</body>

</html>
