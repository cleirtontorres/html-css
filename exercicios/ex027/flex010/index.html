<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            background-color: antiquewhite;
            border: 2px solid black;
            margin-top: 10px;
            flex-direction: row;
            flex-wrap: nowrap;
        }

        div.itens{

            background-color: aqua;
            margin: 5px;
            border: 2px solid black;
            text-align: center;
            flex-basis: 160px;
            flex-shrink: 1;
            flex-grow: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
    </div>
</body>

</html>
