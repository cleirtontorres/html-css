<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            background-color: antiquewhite;
            border: 2px solid black;
            margin-top: 10px;
            flex-flow: row wrap;
        }

        div.itens{
            padding: 20px;
            background-color: aqua;
            margin: 5px;
            border: 2px solid black;
            text-align: center;
        }

        #i1{
            order:1;
        }

        #i2{
             order:-1;
        }

        #i3{
             order:5;
        }

        #i4{
             order:3;
        }

        #i5{
             order:9;
        }

        #i6{
             order:-5;
        }

        #i7{
             order:-2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="itens" id="i1">A</div>
        <div class="itens" id="i2">B</div>
        <div class="itens" id="i3">C</div>
        <div class="itens" id="i4">D</div>
        <div class="itens" id="i5">E</div>
        <div class="itens" id="i6">F</div>
        <div class="itens" id="i7">G</div>
    </div>
</body>

</html>
