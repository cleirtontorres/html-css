<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando div</title>
   <style>
    div > p{
        display: none;
    }

    div:hover > p{
        display: block;
        background-color:#cff3f5;
        font: normal 2em Arial, Helvetica, sans-serif;
        height: 130px;
        width:400px;
    }
   </style>
</head>
<body>
  <h1>Mostrando o texto</h1>
  <div>
    Passe o mouse aqui <br>
    <p>SURPRESAAA!!! Você acaba de encontrar o texto escondido Parabêns!</p>
    <br>
    Veja o conteúdo oculto aparecendo.
  </div>
</body>
</html>
