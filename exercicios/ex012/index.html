<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospedagem de videos</title>
</head>

<body>
    <h1>Inserindo vídeos no meu arquivo</h1>
    <p>Este video está hospedado dentro do próprio servidor.</p>
    <video width="500px" src="midia/Papagaiosvideo.mp4" controls></video>

    <video width="500px" poster="imagens/casal-de-papagaios.png" controls>
        <source src="midia/Papagaiosvideo(1).webm" type="video/mp4">
        <source src="midia/Papagaiosvideo.mp4" type="video/mp4">
        <source src="midia/papagaiosvideoo.mp4" type="video/mp4">
        <source src="midia/Papagaiosvideo.ogv" type="video/ogg">
        <p>Seu navegador não suporta reprodução de vídeos.</p>
    </video>

    <h1>Inserindo vídeos do YouTube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/h4NzUoUVi38?si=pVz5ReGpS4D6YOvM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <iframe width="560" height="315" src="https://www.youtube.com/embed/AfoC_65TwF0?si=MCNv_DjBaSkqOjii" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>

</html>
