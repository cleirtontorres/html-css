<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens dinamicas</title>
</head>
<body>
    <h1>Imagens flexíveis</h1>
    <picture>
        <source media="(max-width: 750px)"  srcset="imagens/praia300.jpg">

        <img src="imagens/praia1k.jpg" alt="Imagem flexível">
    </picture>
    <hr>
        <h1>Reproduzindo áudio</h1>
        <p>Vamos reproduzir áudios em HTML5</p>
        <audio src="midia/a-long-cold-riot.mp3" controls autoplay></audio>
          
        <audio controls>
            <source src="midia/home-base-grove.mp3" type="audio/mpeg">
        </audio>
</body>
</html>
