<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;
        }

        caption{
            font-size:1.4em;
            font-weight: bold;
            padding: 5px;
        }

        td, th{
            border:1px solid black;
            padding: 5px;
        }

        .cor1{
            background-color: #3fabdc;
        }

        .cor2{
            background-color: #39b1b9;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>
    <table>
        <colgroup>
        <col class="cor1"> 
        <col class="cor2">
        <col class="cor1">
        <col class="cor2">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Antonio</td>
            <td>M</td>
            <td>40</td>
            <td>Agricultor</td>
        </tr>
        <tr>
            <td>Biatriz Souza</td>
            <td>F</td>
            <td>23</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Daniel</td>
            <td>M</td>
            <td>21</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Roberto</td>
            <td>M</td>
            <td>25</td>
            <td>Educador Fisico</td>
        </tr>
        <tr>
            <td>Belarmino</td>
            <td>M</td>
            <td>55</td>
            <td>Zelador</td>
        </tr>
        <tr>
            <td>Joséfa</td>
            <td>F</td>
            <td>48</td>
            <td>Governanta</td>
        </tr>
    </table>
</body>
</html>
